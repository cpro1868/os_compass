<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS-Compass - 系统变量</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden">
  <div class="flex h-full">
    <!-- 左侧功能菜单 -->
    <aside class="w-16 bg-gray-900 flex flex-col items-center py-4 gap-4">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white mb-4">
        <i class="fa-solid fa-compass text-xl"></i>
      </div>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-plus text-lg mb-1"></i>
        <span class="text-xs">导入</span>
      </button>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
        <span class="text-xs">搜索</span>
      </button>
      
      <div class="flex flex-col gap-1 mt-4 border-t border-gray-700 pt-4">
        <button class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-table-columns"></i>
        </button>
        <button class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-list"></i>
        </button>
      </div>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition mt-auto">
        <i class="fa-solid fa-folder-tree text-lg mb-1"></i>
        <span class="text-xs">分类</span>
      </button>
      
      <div class="border-t border-gray-700 pt-4 mt-4 w-full flex flex-col items-center gap-3">
        <button class="w-12 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-key"></i>
        </button>
        <button class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col">
      <!-- 设置标签栏 -->
      <div class="bg-white border-b border-gray-200 px-6">
        <div class="flex gap-4 pt-4">
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">通用</button>
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">下载</button>
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">大模型</button>
          <button class="px-4 py-2 text-blue-600 border-b-2 border-blue-600 font-medium">变量管理</button>
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">扩展配置</button>
        </div>
      </div>

      <!-- 内容区 -->
      <div class="flex-1 p-6 overflow-auto">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-medium">系统变量</h2>
          <button onclick="openAddModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            <i class="fa-solid fa-plus mr-2"></i>新增变量
          </button>
        </div>

        <p class="text-sm text-gray-500 mb-4">
          系统变量用于扩展配置。敏感变量会加密存储。
        </p>

        <!-- 变量列表 -->
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
          <table class="w-full">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-4 py-3 text-sm font-medium text-gray-600">键名</th>
                <th class="text-left px-4 py-3 text-sm font-medium text-gray-600">变量值</th>
                <th class="text-center px-4 py-3 text-sm font-medium text-gray-600">类型</th>
                <th class="text-center px-4 py-3 text-sm font-medium text-gray-600">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-mono text-sm">github_token</td>
                <td class="px-4 py-3 font-mono text-sm text-gray-500">●●●●●●●●●●●●●●●●</td>
                <td class="px-4 py-3 text-center"><span class="px-2 py-1 bg-orange-100 text-orange-700 text-xs rounded">敏感</span></td>
                <td class="px-4 py-3 text-center"><button class="text-blue-600 hover:underline mr-2">编辑</button><button class="text-red-600 hover:underline">删除</button></td>
              </tr>
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-mono text-sm">gitee_token</td>
                <td class="px-4 py-3 font-mono text-sm text-gray-500">●●●●●●●●●●●●●●●●</td>
                <td class="px-4 py-3 text-center"><span class="px-2 py-1 bg-orange-100 text-orange-700 text-xs rounded">敏感</span></td>
                <td class="px-4 py-3 text-center"><button class="text-blue-600 hover:underline mr-2">编辑</button><button class="text-red-600 hover:underline">删除</button></td>
              </tr>
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-mono text-sm">github_proxy</td>
                <td class="px-4 py-3 font-mono text-sm">http://127.0.0.1:7890</td>
                <td class="px-4 py-3 text-center"><span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded">普通</span></td>
                <td class="px-4 py-3 text-center"><button class="text-blue-600 hover:underline mr-2">编辑</button><button class="text-red-600 hover:underline">删除</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
      <div class="p-6 border-b">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-medium">新增系统变量</h3>
          <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">键名</label>
          <input type="text" placeholder="变量键名，如 github_token"
                 class="w-full px-3 py-2 border rounded-lg font-mono">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">变量值</label>
          <input type="password" placeholder="变量值"
                 class="w-full px-3 py-2 border rounded-lg font-mono">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="isSecret" class="rounded">
          <label for="isSecret" class="text-sm">敏感变量（加密存储）</label>
        </div>
      </div>
      <div class="p-6 border-t flex justify-end gap-3">
        <button onclick="closeAddModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
      </div>
    </div>
  </div>

  <script>
    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    document.getElementById('addModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('addModal')) {
        closeAddModal();
      }
    });
  </script>
</body>
</html>
