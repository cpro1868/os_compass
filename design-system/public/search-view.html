<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS-Compass - 智能搜索</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    .typing-indicator span {
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen overflow-hidden">
  <div class="flex h-full">
    <!-- 左侧边栏 - 历史记录 -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
      <div class="p-4 border-b border-gray-200">
        <h2 class="font-semibold text-sm text-gray-500 uppercase tracking-wide">搜索历史</h2>
      </div>
      <div class="flex-1 overflow-auto p-2">
        <div class="space-y-1">
          <button class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-gray-100 text-gray-700 truncate">
            <i class="fa-regular fa-clock mr-2 text-gray-400"></i>前端框架推荐
          </button>
          <button class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-gray-100 text-gray-700 truncate">
            <i class="fa-regular fa-clock mr-2 text-gray-400"></i>Rust Web 框架
          </button>
          <button class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-gray-100 text-gray-700 truncate">
            <i class="fa-regular fa-clock mr-2 text-gray-400"></i>Python 机器学习库
          </button>
          <button class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-gray-100 text-gray-700 truncate">
            <i class="fa-regular fa-clock mr-2 text-gray-400"></i>数据库 ORM 框架
          </button>
        </div>
      </div>
      <div class="p-3 border-t border-gray-200">
        <button class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-gray-100 text-gray-500">
          <i class="fa-solid fa-plus mr-2"></i>新建搜索
        </button>
      </div>
    </aside>

    <!-- 主聊天区域 -->
    <main class="flex-1 flex flex-col bg-white">
      <!-- 顶部栏 -->
      <header class="h-14 border-b border-gray-200 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-robot text-white text-sm"></i>
          </div>
          <div>
            <h1 class="font-semibold">智能项目推荐</h1>
            <p class="text-xs text-gray-500">二期功能 · 三层智能搜索：本地库 → 信息源缓存 → 联网搜索</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button class="p-2 hover:bg-gray-100 rounded-lg" title="清除对话">
            <i class="fa-solid fa-trash-can text-gray-500"></i>
          </button>
        </div>
      </header>

      <!-- 聊天消息区域 -->
      <div id="chatContainer" class="flex-1 overflow-auto p-6 space-y-6">
        <!-- 欢迎消息 -->
        <div class="flex gap-4 max-w-3xl mx-auto">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex-shrink-0 flex items-center justify-center">
            <i class="fa-solid fa-robot text-white text-sm"></i>
          </div>
          <div class="flex-1">
            <div class="bg-gray-100 rounded-2xl rounded-tl-sm p-4">
              <p class="text-gray-700">
                您好！我是您的开源项目助手。输入您的需求，系统将按三层优先级搜索：先查本地项目库，再查信息源缓存，最后联网搜索补充结果。
              </p>
            </div>
            <div class="mt-3 flex flex-wrap gap-2">
              <button onclick="sendSuggestion('前端状态管理库')" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition">
                前端状态管理库
              </button>
              <button onclick="sendSuggestion('Python Web 框架')" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition">
                Python Web 框架
              </button>
              <button onclick="sendSuggestion('Rust 日志库')" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition">
                Rust 日志库
              </button>
              <button onclick="sendSuggestion('开源人脸识别项目')" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition">
                开源人脸识别项目
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 搜索输入框 -->
      <div class="border-t border-gray-200 p-4">
        <div class="max-w-3xl mx-auto">
          <div class="relative bg-white border border-gray-300 rounded-2xl shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-200 transition">
            <textarea id="chatInput" rows="1" placeholder="描述您的需求..." 
              class="w-full px-4 py-3 pr-12 rounded-2xl resize-none focus:outline-none"
              onkeydown="handleKeyDown(event)"
              oninput="autoResize(this)"></textarea>
            <button id="sendBtn" onclick="sendMessage()" 
              class="absolute right-2 bottom-2 w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center justify-center transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
              <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
          </div>
          <div class="flex items-center justify-between mt-2 px-1">
            <p class="text-xs text-gray-400">AI 助手可帮助您找到合适的开源项目</p>
            <p class="text-xs text-gray-400"><kbd class="px-1 py-0.5 bg-gray-100 rounded">Enter</kbd> 发送</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 结果预览弹窗 -->
  <div id="resultModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[80vh] overflow-hidden shadow-xl">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h3 class="font-semibold">推荐项目</h3>
        <button onclick="closeModal()" class="p-1 hover:bg-gray-100 rounded-lg">
          <i class="fa-solid fa-xmark text-gray-500"></i>
        </button>
      </div>
      <div id="resultList" class="p-4 max-h-[60vh] overflow-auto space-y-3">
        <!-- 项目卡片由 JavaScript 动态生成 -->
      </div>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatContainer = document.getElementById('chatContainer');

    // 自动调整输入框高度
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      sendBtn.disabled = !el.value.trim();
    }

    // 处理键盘事件
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (chatInput.value.trim()) {
          sendMessage();
        }
      }
    }

    // 发送消息
    function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      // 添加用户消息
      addMessage('user', message);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      sendBtn.disabled = true;

      // 模拟 AI 思考
      showTypingIndicator();

      // 模拟 AI 回复
      setTimeout(() => {
        hideTypingIndicator();
        const results = getAIResponse(message);
        addMessage('assistant', results.summary);
        // 渲染结果弹窗
        renderResultList(results.items);
        document.getElementById('resultModal').classList.remove('hidden');
        document.getElementById('resultModal').classList.add('flex');
      }, 1500);
    }

    // 添加消息到聊天区域
    function addMessage(role, content) {
      const isUser = role === 'user';
      const avatar = isUser 
        ? '<div class="w-8 h-8 bg-gray-200 rounded-lg flex-shrink-0 flex items-center justify-center"><i class="fa-solid fa-user text-gray-600 text-sm"></i></div>'
        : '<div class="w-8 h-8 bg-blue-600 rounded-lg flex-shrink-0 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-sm"></i></div>';

      const messageHtml = `
        <div class="flex gap-4 max-w-3xl mx-auto">
          ${avatar}
          <div class="flex-1">
            <div class="${isUser ? 'bg-blue-600 text-white rounded-2xl rounded-tr-sm' : 'bg-gray-100 rounded-2xl rounded-tl-sm'} rounded-2xl ${isUser ? 'rounded-tr-sm' : 'rounded-tl-sm'} p-4">
              <p class="${isUser ? '' : 'text-gray-700'}">${content}</p>
            </div>
          </div>
        </div>
      `;

      chatContainer.insertAdjacentHTML('beforeend', messageHtml);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 显示打字指示器
    function showTypingIndicator() {
      const typingHtml = `
        <div id="typingIndicator" class="flex gap-4 max-w-3xl mx-auto">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex-shrink-0 flex items-center justify-center">
            <i class="fa-solid fa-robot text-white text-sm"></i>
          </div>
          <div class="flex-1">
            <div class="bg-gray-100 rounded-2xl rounded-tl-sm p-4">
              <div class="typing-indicator flex gap-1">
                <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
              </div>
            </div>
          </div>
        </div>
      `;
      chatContainer.insertAdjacentHTML('beforeend', typingHtml);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 隐藏打字指示器
    function hideTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    // 获取 AI 响应（模拟三层搜索结果）
    function getAIResponse(message) {
      // 根据关键词匹配预设结果，未匹配时回退到默认集
      const mockData = {
        '前端状态管理库': {
          summary: `根据您的需求"${message}"，系统按三层优先级搜索完成。本地库命中 1 项，信息源缓存命中 2 项，联网搜索补充 2 项，共 5 个相关项目。`,
          items: [
            { name: 'pmndrs/zustand', source: 'local', health: 95, desc: '简洁、直观的状态管理解决方案', lang: 'TypeScript', stars: '35k Stars', icon: 'fa-code', iconColor: 'purple' },
            { name: 'reduxjs/redux-toolkit', source: 'cache', health: 90, desc: '官方推荐的 Redux 状态管理工具集', lang: 'TypeScript', stars: '10k Stars', icon: 'fa-layer-group', iconColor: 'orange' },
            { name: 'tanstack/query', source: 'cache', health: 94, desc: '强大的异步状态管理与数据获取库', lang: 'TypeScript', stars: '42k Stars', icon: 'fa-layer-group', iconColor: 'orange' },
            { name: 'pinia-ecommerce/store', source: 'web', health: 85, desc: '面向电商场景的 Pinia 状态管理方案', lang: 'TypeScript', stars: '1.2k Stars', icon: 'fa-globe', iconColor: 'blue' },
            { name: 'nathanbale/state-machine', source: 'web', health: null, desc: '基于状态机的前端状态管理新方案', lang: 'TypeScript', stars: '320 Stars', icon: 'fa-globe', iconColor: 'blue' },
          ]
        },
        'Python Web 框架': {
          summary: `根据您的需求"${message}"，系统按三层优先级搜索完成。本地库命中 1 项，信息源缓存命中 2 项，联网搜索补充 2 项，共 5 个相关项目。`,
          items: [
            { name: 'pallets/flask', source: 'local', health: 93, desc: '轻量级 Python Web 框架', lang: 'Python', stars: '66k Stars', icon: 'fa-flask', iconColor: 'blue' },
            { name: 'tiangolo/fastapi', source: 'cache', health: 96, desc: '现代、快速的 Web 框架，基于标准类型提示', lang: 'Python', stars: '70k Stars', icon: 'fa-bolt', iconColor: 'orange' },
            { name: 'encode/starlette', source: 'cache', health: 88, desc: '轻量级 ASGI 框架/工具包', lang: 'Python', stars: '9.5k Stars', icon: 'fa-bolt', iconColor: 'orange' },
            { name: 'litestar-org/litestar', source: 'web', health: 82, desc: '新一代轻量、高性能 ASGI 框架', lang: 'Python', stars: '3.8k Stars', icon: 'fa-globe', iconColor: 'blue' },
            { name: 'molten-framework/molten', source: 'web', health: null, desc: '极简的 Python Web API 框架', lang: 'Python', stars: '850 Stars', icon: 'fa-globe', iconColor: 'blue' },
          ]
        },
        'Rust 日志库': {
          summary: `根据您的需求"${message}"，系统按三层优先级搜索完成。本地库命中 1 项，信息源缓存命中 2 项，联网搜索补充 2 项，共 5 个相关项目。`,
          items: [
            { name: 'tokio-rs/tracing', source: 'local', health: 94, desc: '应用级分布式追踪与日志框架', lang: 'Rust', stars: '4.8k Stars', icon: 'fa-route', iconColor: 'orange' },
            { name: 'tokio-rs/log', source: 'cache', health: 91, desc: 'Rust 生态标准日志门面库', lang: 'Rust', stars: '2.1k Stars', icon: 'fa-file-lines', iconColor: 'orange' },
            { name: 'slog-rs/slog', source: 'cache', health: 86, desc: '结构化、可组合的日志库', lang: 'Rust', stars: '1.4k Stars', icon: 'fa-file-lines', iconColor: 'orange' },
            { name: 'flexzero/fern', source: 'web', health: 79, desc: '简单易用的 Rust 日志配置库', lang: 'Rust', stars: '680 Stars', icon: 'fa-globe', iconColor: 'blue' },
            { name: 'rbalog/logscope', source: 'web', health: null, desc: '基于作用域的 Rust 日志筛选新方案', lang: 'Rust', stars: '120 Stars', icon: 'fa-globe', iconColor: 'blue' },
          ]
        },
        '开源人脸识别项目': {
          summary: `根据您的需求"${message}"，系统按三层优先级搜索完成。本地库命中 1 项，信息源缓存命中 2 项，联网搜索补充 2 项，共 5 个相关项目。`,
          items: [
            { name: 'ageitgey/face_recognition', source: 'local', health: 89, desc: '最简单的 Python 人脸识别 API', lang: 'Python', stars: '52k Stars', icon: 'fa-face-grin', iconColor: 'blue' },
            { name: 'deepinsight/insightface', source: 'cache', health: 92, desc: '2D/3D 人脸分析开源工具包', lang: 'Python', stars: '22k Stars', icon: 'fa-face-smile', iconColor: 'orange' },
            { name: 'dlib-platform/dlib', source: 'cache', health: 87, desc: '含人脸检测与现代 C++ 算法的工具箱', lang: 'C++', stars: '13k Stars', icon: 'fa-face-smile', iconColor: 'orange' },
            { name: 'mobilevet/face-mask-detect', source: 'web', health: 81, desc: '人脸口罩检测实时推理项目', lang: 'Python', stars: '2.3k Stars', icon: 'fa-globe', iconColor: 'blue' },
            { name: 'edgeai/facemesh-lite', source: 'web', health: null, desc: '面向边缘设备的人脸网格推理项目', lang: 'C++', stars: '540 Stars', icon: 'fa-globe', iconColor: 'blue' },
          ]
        }
      };

      if (mockData[message]) {
        return mockData[message];
      }

      // 默认回退：演示三层结构
      return {
        summary: `根据您的需求"${message}"，系统按三层优先级搜索完成。本地库命中 1 项，信息源缓存命中 2 项，联网搜索补充 2 项，共 5 个相关项目。`,
        items: [
          { name: 'local/sample-local', source: 'local', health: 90, desc: '本地项目库中已入库的示例项目', lang: 'TypeScript', stars: '5k Stars', icon: 'fa-database', iconColor: 'blue' },
          { name: 'cache/sample-cache-1', source: 'cache', health: 85, desc: '信息源缓存中的示例项目一', lang: 'Rust', stars: '2k Stars', icon: 'fa-rss', iconColor: 'orange' },
          { name: 'cache/sample-cache-2', source: 'cache', health: 83, desc: '信息源缓存中的示例项目二', lang: 'Python', stars: '1.5k Stars', icon: 'fa-rss', iconColor: 'orange' },
          { name: 'web/sample-web-1', source: 'web', health: 78, desc: '联网搜索补充的示例项目一', lang: 'Go', stars: '600 Stars', icon: 'fa-globe', iconColor: 'blue' },
          { name: 'web/sample-web-2', source: 'web', health: null, desc: '联网搜索补充的示例项目二', lang: 'C', stars: '180 Stars', icon: 'fa-globe', iconColor: 'blue' },
        ]
      };
    }

    // 渲染结果列表
    function renderResultList(items) {
      const list = document.getElementById('resultList');
      list.innerHTML = items.map(item => createProjectCard(item)).join('');
    }

    // 生成单个项目卡片 HTML
    function createProjectCard(item) {
      const sourceMap = {
        local:  { label: '本地库', cls: 'bg-blue-100 text-blue-700' },
        cache:  { label: '缓存',   cls: 'bg-green-100 text-green-700' },
        web:    { label: '联网',   cls: 'bg-purple-100 text-purple-700' },
      };
      const src = sourceMap[item.source] || sourceMap.web;
      const healthBadge = item.health
        ? `<span class="px-2 py-0.5 text-xs bg-green-100 text-green-700 rounded">健康度 ${item.health}</span>`
        : '';
      const actionBtn = item.source === 'local'
        ? `<span class="px-3 py-1.5 text-sm bg-gray-100 text-gray-500 rounded-lg cursor-default">已入库</span>`
        : `<button onclick="importProject('${item.name}')" class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">导入</button>`;
      const iconColorMap = {
        blue: 'bg-blue-100 text-blue-600',
        purple: 'bg-purple-100 text-purple-600',
        orange: 'bg-orange-100 text-orange-600',
      };
      const iconCls = iconColorMap[item.iconColor] || iconColorMap.blue;

      return `
        <div class="border border-gray-200 rounded-xl p-4 hover:border-blue-300 hover:shadow-md transition cursor-pointer">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 ${iconCls} rounded-xl flex items-center justify-center">
              <i class="fa-solid ${item.icon} text-xl"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h4 class="font-semibold">${item.name}</h4>
                <span class="px-2 py-0.5 text-xs ${src.cls} rounded">${src.label}</span>
                ${healthBadge}
              </div>
              <p class="text-sm text-gray-500 mt-1">${item.desc}</p>
              <div class="flex items-center gap-2 mt-2">
                <span class="px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded">${item.lang}</span>
                <span class="px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded">${item.stars}</span>
              </div>
            </div>
            <div class="flex-shrink-0">${actionBtn}</div>
          </div>
        </div>
      `;
    }

    // 发送建议
    function sendSuggestion(text) {
      chatInput.value = text;
      sendBtn.disabled = false;
      sendMessage();
    }

    // 关闭弹窗
    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
      document.getElementById('resultModal').classList.remove('flex');
    }

    // 导入项目（模拟）
    function importProject(name) {
      alert(`正在导入: ${name}`);
      closeModal();
    }

    // 点击弹窗外部关闭
    document.getElementById('resultModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
