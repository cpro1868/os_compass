<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS-Compass - 扩展配置</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden">
  <div class="flex h-full">
    <!-- 左侧功能菜单 -->
    <aside class="w-16 bg-gray-900 flex flex-col items-center py-4 gap-4">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white mb-4">
        <i class="fa-solid fa-compass text-xl"></i>
      </div>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-plus text-lg mb-1"></i>
        <span class="text-xs">导入</span>
      </button>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
        <span class="text-xs">搜索</span>
      </button>
      
      <div class="flex flex-col gap-1 mt-4 border-t border-gray-700 pt-4">
        <button class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-table-columns"></i>
        </button>
        <button class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-list"></i>
        </button>
      </div>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition mt-auto">
        <i class="fa-solid fa-folder-tree text-lg mb-1"></i>
        <span class="text-xs">分类</span>
      </button>
      
      <div class="border-t border-gray-700 pt-4 mt-4 w-full flex flex-col items-center gap-3">
        <button class="w-12 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-puzzle-piece"></i>
        </button>
        <button class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col">
      <!-- 设置标签栏 -->
      <div class="bg-white border-b border-gray-200 px-6">
        <div class="flex gap-4 pt-4">
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">通用</button>
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">下载</button>
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">大模型</button>
          <button class="px-4 py-2 text-gray-600 hover:text-blue-600 border-b-2 border-transparent">变量管理</button>
          <button class="px-4 py-2 text-blue-600 border-b-2 border-blue-600 font-medium">扩展配置</button>
        </div>
      </div>

      <!-- 内容区 -->
      <div class="flex-1 p-6 overflow-auto">
        <h2 class="text-lg font-medium mb-4">已安装的扩展</h2>
        
        <!-- 扩展列表 -->
        <div class="space-y-4">
          
          <!-- GitHub 扩展 -->
          <div class="bg-white rounded-xl border border-gray-200 p-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-800 rounded-lg flex items-center justify-center text-white">
                  <i class="fa-brands fa-github text-xl"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-medium">GitHub</span>
                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">v1.0.0</span>
                  </div>
                  <p class="text-sm text-gray-500 font-mono">plugins.GitHubPlugin</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" class="sr-only peer" checked>
                  <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
                <button onclick="openConfig('github')" class="px-3 py-1.5 text-sm border rounded-lg hover:bg-gray-50">
                  <i class="fa-solid fa-gear mr-1"></i>配置
                </button>
              </div>
            </div>
            <div class="mt-3 pt-3 border-t text-sm text-gray-500">
              <span class="text-orange-500">*</span> 需要配置变量：github_token（Token）、github_proxy（代理）
            </div>
          </div>

          <!-- Gitee 扩展 -->
          <div class="bg-white rounded-xl border border-gray-200 p-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-500 rounded-lg flex items-center justify-center text-white">
                  <i class="fa-solid fa-code text-xl"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-medium">Gitee</span>
                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">v1.0.0</span>
                  </div>
                  <p class="text-sm text-gray-500 font-mono">plugins.GiteePlugin</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" class="sr-only peer" checked>
                  <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
                <button onclick="openConfig('gitee')" class="px-3 py-1.5 text-sm border rounded-lg hover:bg-gray-50">
                  <i class="fa-solid fa-gear mr-1"></i>配置
                </button>
              </div>
            </div>
            <div class="mt-3 pt-3 border-t text-sm text-gray-500">
              <span class="text-orange-500">*</span> 需要配置变量：gitee_token（私有令牌）
            </div>
          </div>

          <!-- Crawler 扩展（内置） -->
          <div class="bg-white rounded-xl border border-gray-200 p-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-600 rounded-lg flex items-center justify-center text-white">
                  <i class="fa-solid fa-spider text-xl"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-medium">通用爬虫</span>
                    <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded">内置</span>
                  </div>
                  <p class="text-sm text-gray-500 font-mono">plugins.CrawlerPlugin</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-sm text-green-600">
                  <i class="fa-solid fa-check-circle mr-1"></i>无需配置
                </span>
              </div>
            </div>
          </div>

          <!-- NPM 扩展（待开发） -->
          <div class="bg-gray-50 rounded-xl border border-gray-200 p-4 opacity-60">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-500 rounded-lg flex items-center justify-center text-white">
                  <i class="fa-brands fa-npm text-2xl"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-medium text-gray-400">NPM</span>
                    <span class="text-xs bg-gray-200 text-gray-500 px-2 py-0.5 rounded">待开发</span>
                  </div>
                  <p class="text-sm text-gray-400 font-mono">plugins.NpmPlugin</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button disabled class="px-3 py-1.5 text-sm border rounded-lg bg-gray-100 text-gray-400 cursor-not-allowed">
                  <i class="fa-solid fa-gear mr-1"></i>配置
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- 扩展配置弹窗 -->
  <div id="configModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
      <div class="p-6 border-b">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-medium" id="modalTitle">扩展配置</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">变量配置</label>
          <div id="variablesList" class="space-y-3">
            <!-- 动态填充 -->
          </div>
        </div>
      </div>
      <div class="p-6 border-t flex justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
        <button onclick="saveConfig()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
      </div>
    </div>
  </div>

  <script>
    const extensions = {
      github: {
        name: 'GitHub',
        variables: [
          { key: 'github_token', label: 'Token', type: 'password', placeholder: 'ghp_xxx', secret: true },
          { key: 'github_proxy', label: '代理地址', type: 'text', placeholder: 'http://127.0.0.1:7890', secret: false }
        ]
      },
      gitee: {
        name: 'Gitee',
        variables: [
          { key: 'gitee_token', label: '私有令牌', type: 'password', placeholder: '请输入 Gitee 私有令牌', secret: true }
        ]
      }
    };

    let currentPlugin = null;

    function openConfig(pluginId) {
      currentPlugin = pluginId;
      const plugin = extensions[pluginId];
      if (!plugin) return;

      document.getElementById('modalTitle').textContent = plugin.name + ' 扩展配置';
      
      const list = document.getElementById('variablesList');
      list.innerHTML = plugin.variables.map(v => `
        <div>
          <label class="block text-sm font-medium mb-1">${v.label}</label>
          <input type="${v.type}" 
                 data-key="${v.key}" 
                 placeholder="${v.placeholder}"
                 class="w-full px-3 py-2 border rounded-lg ${v.secret ? 'font-mono' : ''}">
          ${v.secret ? '<p class="text-xs text-gray-500 mt-1">将加密存储</p>' : ''}
        </div>
      `).join('');

      document.getElementById('configModal').classList.remove('hidden');
      document.getElementById('configModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('configModal').classList.add('hidden');
      document.getElementById('configModal').classList.remove('flex');
    }

    function saveConfig() {
      // 实际保存逻辑
      closeModal();
    }

    // 点击外部关闭
    document.getElementById('configModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('configModal')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
