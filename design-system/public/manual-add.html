<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS-Compass - 手动录入项目</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden">
  <div class="flex h-full">
    <!-- 左侧功能菜单 -->
    <aside class="w-16 bg-gray-900 flex flex-col items-center py-4 gap-4">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white mb-4">
        <i class="fa-solid fa-compass text-xl"></i>
      </div>
      
      <button onclick="location.href='import-form.html'" class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-plus text-lg mb-1"></i>
        <span class="text-xs">导入</span>
      </button>
      
      <button class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
        <span class="text-xs">搜索</span>
      </button>
      
      <div class="flex flex-col gap-1 mt-4 border-t border-gray-700 pt-4">
        <button onclick="location.href='main-interface.html'" class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-table-columns"></i>
        </button>
        <button onclick="location.href='list-view.html'" class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-list"></i>
        </button>
      </div>
      
      <button onclick="location.href='category-manager.html'" class="w-12 h-12 rounded-xl hover:bg-gray-800 flex flex-col items-center justify-center text-gray-400 hover:text-white transition mt-auto">
        <i class="fa-solid fa-folder-tree text-lg mb-1"></i>
        <span class="text-xs">分类</span>
      </button>
      
      <div class="border-t border-gray-700 pt-4 mt-4 w-full flex flex-col items-center gap-3">
        <button onclick="location.href='settings.html'" class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-gear"></i>
        </button>
        <button onclick="location.href='plugin-manager.html'" class="w-12 h-10 rounded-lg hover:bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-plug"></i>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex items-center justify-center">
      <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8 w-full max-w-xl">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-2xl font-bold">手动录入项目</h1>
          <button onclick="location.href='import-form.html'" class="text-sm text-blue-600 hover:underline">
            <i class="fa-solid fa-link mr-1"></i>从链接导入
          </button>
        </div>
        <p class="text-sm text-gray-500 mb-6">适用于私有仓库、内网项目或非主流托管平台</p>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">
              项目名称 <span class="text-red-500">*</span>
            </label>
            <input type="text" placeholder="例如：My Private Tool" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">项目地址</label>
            <input type="text" placeholder="https://gitlab.com/xxx/yyy（可选）" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">项目描述</label>
            <textarea rows="3" placeholder="简要描述这个项目的用途..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">分类</label>
            <select class="w-full px-3 py-2 border rounded-lg">
              <option value="0" selected>未分类</option>
              <option value="1">前端框架</option>
              <option value="2">前端框架 / React 生态</option>
              <option value="3">前端框架 / Vue 生态</option>
              <option value="4">后端服务</option>
              <option value="5">数据库</option>
              <option value="6">AI / ML</option>
            </select>
          </div>
          <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
            <p class="text-sm text-blue-700">
              <i class="fa-solid fa-info-circle mr-1"></i>
              手动录入的项目初始状态为"💡 待探索"，可在看板中拖拽调整
            </p>
          </div>
          <div class="flex gap-3 pt-4">
            <button onclick="location.href='main-interface.html'" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
            <button class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
