<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 北指针渐变 (暖色高光) -->
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- 南指针渐变 (冷色暗面) -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- 环形发光渐变 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- 柔和阴影 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 图标圆角背景 (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>

  <!-- OS 架构同心环 (Ring 3, Ring 1, Ring 0) -->
  <g transform="translate(256, 256)">
    <!-- 外环: User Space -->
    <circle r="150" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />
    <!-- 中环: Device Drivers / Services -->
    <circle r="105" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="40 15 10 15" opacity="0.6" />
    <!-- 内环: Kernel / Ring 0 -->
    <circle r="60" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.8" />

    <!-- 罗盘四向基准刻度点 -->
    <circle cx="0" cy="-165" r="4" fill="#38BDF8" />
    <circle cx="165" cy="0" r="3" fill="#64748B" />
    <circle cx="0" cy="165" r="3" fill="#64748B" />
    <circle cx="-165" cy="0" r="3" fill="#64748B" />

    <!-- 指针整体组合（带阴影） -->
    <g filter="url(#glow)">
      <!-- 北指针 (亮红/橙) -->
      <polygon points="0,-140 28,-10 0,0" fill="url(#needleNorth)" />
      <polygon points="0,-140 -28,-10 0,0" fill="#F43F5E" />

      <!-- 南指针 (冷灰/蓝) -->
      <polygon points="0,140 28,10 0,0" fill="url(#needleSouth)" />
      <polygon points="0,140 -28,10 0,0" fill="#334155" />

      <!-- 中心轴承与内核核心 -->
      <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
      <circle cx="0" cy="0" r="5" fill="#38BDF8" />
    </g>
  </g>
</svg>
